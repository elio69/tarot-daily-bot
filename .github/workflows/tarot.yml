name: tarot-bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# не запускать два прохода одновременно: состояние хранится в репозитории
concurrency:
  group: tarot-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py --once
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      - name: Save state
        run: |
          git config user.name "tarot-bot"
          git config user.email "tarot-bot@users.noreply.github.com"
          git add data/state.json data/history.json
          git diff --cached --quiet || (git commit -m "state" && git push)
